<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http: https:;"><title>LibraCord · Choose home server</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#372064,#10152d 55%,#090b16);color:#f7f5ff;font:16px system-ui,sans-serif}.card{width:min(560px,calc(100vw - 40px));padding:34px;border:1px solid #ffffff26;border-radius:26px;background:#11162be8;box-shadow:0 24px 80px #0008}.mark{width:56px;height:56px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#50d8de,#8568ff);font-weight:800;font-size:24px}h1{margin:20px 0 8px}p{color:#aeb5ce;line-height:1.5}.row{display:flex;gap:10px;margin-top:22px}input{flex:1;min-width:0;padding:14px 16px;border-radius:13px;border:1px solid #ffffff22;background:#090e1d;color:white;font:inherit}button{padding:0 20px;border:0;border-radius:13px;background:#55d9d1;color:#06121b;font-weight:750;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hint{font-size:13px;margin-top:14px}.error{color:#ff99aa;margin-top:12px;min-height:20px}
</style></head><body><main class="card"><div class="mark">L</div><h1>Choose your home server</h1><p>LibraCord is federated. Pick the instance that holds your account before signing in.</p><form id="form"><div class="row"><input id="server" required placeholder="https://chat.example.com"><button id="continue">Continue</button></div></form><p class="hint">Your server is checked before opening and saved on this device until you log out.</p><div id="error" class="error"></div></main><script>
const form=document.querySelector('#form'),input=document.querySelector('#server'),button=document.querySelector('#continue'),error=document.querySelector('#error');
if(new URLSearchParams(location.search).get('loggedOut')==='1')localStorage.removeItem('libracord.homeServer');
let launchConfig={defaultHomeServer:'http://localhost:3002',clientOrigin:''};
(async()=>{try{launchConfig=await window.libracordDesktop.getLaunchConfig()}catch{}const saved=localStorage.getItem('libracord.homeServer');input.value=saved||launchConfig.defaultHomeServer})();
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';let raw=input.value.trim();if(!raw.startsWith('http://')&&!raw.startsWith('https://'))raw='https://'+raw;try{const url=new URL(raw);if(!['http:','https:'].includes(url.protocol))throw Error('Use an HTTP or HTTPS home server URL.');button.disabled=true;button.textContent='Connecting…';const health=await fetch(url.origin+'/health',{cache:'no-store'});if(!health.ok)throw Error(`The server responded with ${health.status}.`);const clientOrigin=launchConfig.clientOrigin||url.origin;await window.libracordDesktop.trustOrigin(url.origin);await window.libracordDesktop.trustOrigin(clientOrigin);localStorage.setItem('libracord.homeServer',url.origin);location.href=clientOrigin.replace(/\/$/,'')+'/?server='+encodeURIComponent(url.origin)+'&desktop_cache='+Date.now()}catch(err){error.textContent=err.message==='Failed to fetch'?'Could not connect to that LibraCord server. Check that it is running and the port is correct.':(err.message||'Enter a valid home server URL.');button.disabled=false;button.textContent='Continue'}});
</script></body></html>
