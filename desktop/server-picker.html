<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http: https:;"><title>LibraCord · Choose home server</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#372064,#10152d 55%,#090b16);color:#f7f5ff;font:16px system-ui,sans-serif}.card{width:min(560px,calc(100vw - 40px));padding:34px;border:1px solid #ffffff26;border-radius:26px;background:#11162be8;box-shadow:0 24px 80px #0008}.mark{width:56px;height:56px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#50d8de,#8568ff);font-weight:800;font-size:24px}h1{margin:20px 0 8px}p{color:#aeb5ce;line-height:1.5}.directory{display:grid;gap:9px;margin-top:22px}.directory label,.url-label{color:#dfe4f5;font-size:13px;font-weight:700}.url-label{display:block;margin-top:18px}.directory small{min-height:18px;color:#8e9ab8;font-size:12px}.row{display:flex;gap:10px;margin-top:10px}input,select{width:100%;min-width:0;padding:14px 16px;border-radius:13px;border:1px solid #ffffff22;background:#090e1d;color:white;font:inherit}select{cursor:pointer}input:focus,select:focus{outline:2px solid #6977ff;border-color:transparent}button{padding:0 20px;border:0;border-radius:13px;background:#55d9d1;color:#06121b;font-weight:750;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hint{font-size:13px;margin-top:14px}.error{color:#ff99aa;margin-top:12px;min-height:20px}
</style></head><body><main class="card"><div class="mark">L</div><h1>Choose your home server</h1><p>LibraCord is federated. Find your account's instance in the public directory, or enter its address yourself.</p><form id="form"><section class="directory"><label for="directory-search">Find an instance</label><input id="directory-search" type="search" placeholder="Search by name or domain"><select id="directory-instances" aria-label="Public LibraCord instances"><option>Loading public directory…</option></select><small id="directory-status">Loading public instances…</small></section><label class="url-label" for="server">Home server URL</label><div class="row"><input id="server" required placeholder="https://chat.example.com"><button id="continue">Continue</button></div></form><p class="hint">Your server is checked before opening and saved on this device until you log out.</p><div id="error" class="error"></div></main><script>
const form=document.querySelector('#form'),input=document.querySelector('#server'),button=document.querySelector('#continue'),error=document.querySelector('#error'),directorySearch=document.querySelector('#directory-search'),directoryInstances=document.querySelector('#directory-instances'),directoryStatus=document.querySelector('#directory-status');
if(new URLSearchParams(location.search).get('loggedOut')==='1')localStorage.removeItem('libracord.homeServer');
let launchConfig={defaultHomeServer:'http://localhost:3002',clientOrigin:''};
(async()=>{try{launchConfig=await window.libracordDesktop.getLaunchConfig()}catch{}const saved=localStorage.getItem('libracord.homeServer');const savedIsLocal=/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(saved||'');const configuredIsRemote=launchConfig.defaultHomeServer&&!/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(launchConfig.defaultHomeServer);input.value=(saved&&!savedIsLocal)||(!configuredIsRemote?saved: '')||launchConfig.defaultHomeServer})();
let directoryInstancesData=[];
function renderDirectory(query=''){const match=query.trim().toLowerCase();const rows=directoryInstancesData.filter(item=>!match||[item.name,item.publicUrl,item.federationDomain,item.description].some(value=>String(value||'').toLowerCase().includes(match)));directoryInstances.replaceChildren();const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent=rows.length?'Select an instance from the directory':'No matching instances';directoryInstances.append(placeholder);for(const instance of rows){const option=document.createElement('option');option.value=instance.publicUrl;option.textContent=`${instance.name||instance.federationDomain||instance.publicUrl} — ${instance.federationDomain||instance.publicUrl}`;directoryInstances.append(option)}directoryInstances.disabled=!rows.length;directoryStatus.textContent=rows.length?`${rows.length} public instance${rows.length===1?'':'s'} available.`:'No public instances match your search.'}
async function loadDirectory(){try{const response=await fetch('http://directory.libracord.space/api/v1/instances',{cache:'no-store'});if(!response.ok)throw Error(`Directory returned ${response.status}`);const payload=await response.json();directoryInstancesData=(Array.isArray(payload.instances)?payload.instances:[]).filter(item=>{try{const url=new URL(item.publicUrl);return['http:','https:'].includes(url.protocol)}catch{return false}}).sort((a,b)=>String(a.name||a.federationDomain).localeCompare(String(b.name||b.federationDomain)));renderDirectory()}catch{directoryInstancesData=[];directoryInstances.replaceChildren();const option=document.createElement('option');option.textContent='Directory unavailable — enter your URL below';directoryInstances.append(option);directoryInstances.disabled=true;directoryStatus.textContent='The public directory could not be reached. You can still enter your server URL manually.'}}
directorySearch.addEventListener('input',()=>renderDirectory(directorySearch.value));directoryInstances.addEventListener('change',()=>{if(directoryInstances.value)input.value=directoryInstances.value});loadDirectory();
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';let raw=input.value.trim();if(!raw.startsWith('http://')&&!raw.startsWith('https://'))raw='https://'+raw;try{const url=new URL(raw);if(!['http:','https:'].includes(url.protocol))throw Error('Use an HTTP or HTTPS home server URL.');button.disabled=true;button.textContent='Connecting…';const health=await fetch(url.origin+'/health',{cache:'no-store'});if(!health.ok)throw Error(`The server responded with ${health.status}.`);const clientOrigin=launchConfig.clientOrigin||url.origin;await window.libracordDesktop.trustOrigin(url.origin);await window.libracordDesktop.trustOrigin(clientOrigin);localStorage.setItem('libracord.homeServer',url.origin);location.href=clientOrigin.replace(/\/$/,'')+'/?server='+encodeURIComponent(url.origin)+'&desktop_cache='+Date.now()}catch(err){error.textContent=err.message==='Failed to fetch'?'Could not connect to that LibraCord server. Check that it is running and the port is correct.':(err.message||'Enter a valid home server URL.');button.disabled=false;button.textContent='Continue'}});
</script></body></html>
